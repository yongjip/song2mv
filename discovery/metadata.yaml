  lyric-video, music-video, whisper, remotion, ai-agent, coding-agent, claude-code, codex]

search_terms:
  - {intent: "synced lyrics for a song", queries: ["synced lyrics", "lyrics sync", "lrc generator", "srt from song"]}
  - {intent: "time lyrics to audio", queries: ["lyrics alignment", "forced alignment lyrics", "whisper lyrics timestamps"]}
  - {intent: "cut video to the beat", queries: ["beat sync", "beat grid", "bpm detection"]}
  - {intent: "make a lyric video", queries: ["lyric video generator", "karaoke video", "remotion lyrics"]}
  - {intent: "agent tool", queries: ["claude code music video", "codex lyric video", "ai agent video tool"]}
