# Single source for how song2mv describes itself: README headline, pyproject description and keywords,
# GitHub "About" and topics, llms.txt. Keep those in sync with this file by hand until a check script exists.
schema_version: 1

headline: Song in, beat-synced lyric timing and a code-drawn music video out — built for coding agents.

short_description: >-
  Song in, beat-synced lyric timing (LRC, SRT, JSON) and a code-drawn music video out.
  Built for coding agents like Claude Code and Codex.

github_topics: [synced-lyrics, lrc, srt, karaoke, lyrics, lyrics-alignment, whisper, beat-tracking,
  lyric-video, music-video, remotion, claude-code, codex, ai-agents]

# pyproject.toml `keywords` (PyPI search); GitHub topics above follow GitHub's popular topic names instead
